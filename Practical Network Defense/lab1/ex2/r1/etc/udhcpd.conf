# -------------------------------
# DHCP address pool configuration
# -------------------------------

# First IP address that can be assigned to clients
start 192.168.100.18

# Last IP address that can be assigned to clients
end   192.168.100.29


# -------------------------------
# Interface used by the DHCP server
# -------------------------------

# Network interface on which the DHCP server listens
interface eth0


# -------------------------------
# Lease management
# -------------------------------

# Maximum number of simultaneous leases
# (includes active leases, pending offers, and ARP conflict checks)
max_leases 12


# -------------------------------
# DHCP options sent to clients
# -------------------------------

# DNS server that will be automatically configured on clients
opt dns 8.8.8.8

# Subnet mask assigned to clients
option subnet 255.255.255.240

# Default gateway that clients will use (router IP)
opt router 192.168.100.30

# Domain name assigned to clients
option domain pnd.test

# Lease duration in seconds (600 seconds = 10 minutes)
option lease 600