# Set the hostname of the Zebra daemon
hostname r8

# Password used to access Zebra configuration mode
password zebra

# Enable password for privileged (enable) mode
enable password zebra

# ==================== Interface Configuration ====================
# Zebra manages interface IP addresses and installs
# routing information into the Linux kernel

interface eth0
 # Point-to-point link between r8 and r5
 ip address 100.0.0.1/31
 link-detect

interface eth1
 # Point-to-point link between r8 and r6
 ip address 100.0.0.11/31
 link-detect

interface eth2
 # Point-to-point link between r8 and r7
 ip address 100.0.0.3/31
 link-detect

interface eth3
 # Interface connecting r8 to an external network
 ip address 145.97.4.97/27
 link-detect

