# Set the hostname of the OSPF daemon
hostname r8

# Password used to access the OSPF daemon
password zebra

# ==================== OSPF Interface Configuration ====================
# Configure a reduced hello interval on all interfaces
# to speed up neighbor discovery and OSPF convergence

interface eth0
 ospf hello-interval 2

interface eth1
 ospf hello-interval 2

interface eth2
 ospf hello-interval 2

interface eth3
 ospf hello-interval 2

# ==================== OSPF Routing Process ====================
router ospf

 # Advertise the point-to-point link between r8 and r5
 network 100.0.0.1/31 area 0.0.0.0

 # Advertise the point-to-point link between r8 and r6
 network 100.0.0.11/31 area 0.0.0.0

 # Advertise the point-to-point link between r8 and r7
 network 100.0.0.3/31 area 0.0.0.0

 # Advertise the external network connected to r8
 network 145.97.4.97/27 area 0.0.0.0

 
