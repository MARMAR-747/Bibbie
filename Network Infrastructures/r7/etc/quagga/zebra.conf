# Set the hostname of the Zebra daemon
hostname r7

# Password used to access Zebra configuration mode
password zebra

# Enable password for privileged (enable) mode
enable password zebra

# ==================== Interface Configuration ====================
# Zebra is responsible for assigning IP addresses to interfaces
# and installing routing information into the Linux kernel

interface eth0
 # Point-to-point link between r7 and r8
 ip address 100.0.0.2/31
 link-detect

interface eth1
 # Point-to-point link between r7 and r5
 ip address 100.0.0.9/31
 link-detect

interface eth2
 # Point-to-point link between r7 and r6
 ip address 100.0.0.5/31
 link-detect

interface eth3
 # Interface connecting r7 to an external network
 ip address 151.0.45.0/31
 link-detect

