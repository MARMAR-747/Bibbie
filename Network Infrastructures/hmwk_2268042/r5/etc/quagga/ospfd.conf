# Set the hostname of the OSPF daemon
hostname r5

# Set the password used to access the OSPF daemon
password zebra

# ==================== OSPF Interface Configuration ====================
# Configure a reduced hello interval on each interface to speed up
# neighbor discovery and OSPF convergence

interface eth0
 ospf hello-interval 2

interface eth1
 ospf hello-interval 2

interface eth2
 ospf hello-interval 2

interface eth3
 ospf hello-interval 2

# ==================== OSPF Routing Process ====================
router ospf

 # Advertise the external network connected to r5
 # (link between r5 and r4)
 network 193.201.28.0/23 area 0.0.0.0

 # Advertise the point-to-point links between r5 and the other OSPF routers
 network 100.0.0.0/31 area 0.0.0.0   # r5 ↔ r8
 network 100.0.0.8/31 area 0.0.0.0   # r5 ↔ r7
 network 100.0.0.6/31 area 0.0.0.0   # r5 ↔ r6
