# Set the hostname of the Zebra daemon
hostname r5

# Password used to access Zebra configuration mode
password zebra

# Enable password for privileged (enable) mode
enable password zebra

# ==================== Interface Configuration ====================
# Assign IP addresses to the router interfaces and enable link detection
# Zebra is responsible for managing interfaces and installing routes
# into the Linux kernel routing table

interface eth0
 # Interface connecting r5 to r4 and to the external network
 ip address 193.201.29.254/23
 link-detect

interface eth1
 # Point-to-point link between r5 and r8
 ip address 100.0.0.0/31
 link-detect

interface eth2
 # Point-to-point link between r5 and r7
 ip address 100.0.0.8/31
 link-detect

interface eth3
 # Point-to-point link between r5 and r6
 ip address 100.0.0.6/31
 link-detect
