# Run OpenVPN in client mode
client

# Use a TUN virtual interface (layer 3 IP tunnel)
dev tun

# Use TCP as transport protocol
proto tcp

# =====================================================
# Remote VPN endpoint
# The direct connection to r10 (TCP/7070) is commented out
# because it is blocked by the firewall on r4 (Point 12).
#
# remote 151.0.45.1 7070
#
# Instead, the client connects to localhost on port 1194,
# which corresponds to an SSH local port forwarding
# (Point 13: OpenVPN encapsulated inside SSH).
# =====================================================

remote 127.0.0.1 1194

# =====================================================
# Public Key Infrastructure (PKI)
# =====================================================

# Certificate Authority certificate
ca /root/ca.crt

# Client certificate (unique for pc1)
cert /root/vpn_client_1.crt

# Client private key
key /root/vpn_client_1.key

# =====================================================
# Keep VPN interface and keys active across restarts
# =====================================================

# Do not re-read key across restarts
persist-key

# Do not close and reopen the TUN interface on restart
persist-tun

# Set verbosity level for logging
verb 3
