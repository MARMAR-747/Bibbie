# Set the hostname of the OSPF daemon
hostname r6

# Password used to access the OSPF daemon
password zebra

# ==================== OSPF Interface Configuration ====================
# Configure a reduced hello interval on each interface to speed up
# OSPF neighbor discovery and convergence

interface eth0
 ospf hello-interval 2

interface eth1
 ospf hello-interval 2

interface eth2
 ospf hello-interval 2

interface eth3
 ospf hello-interval 2

# ==================== OSPF Routing Process ====================
router ospf

 # Advertise the point-to-point link between r6 and r5
 network 100.0.0.7/31 area 0.0.0.0

 # Advertise the point-to-point link between r6 and r8
 network 100.0.0.10/31 area 0.0.0.0

 # Advertise the point-to-point link between r6 and r7
 network 100.0.0.4/31 area 0.0.0.0

 # Advertise the external network connected to r6
 network 23.75.200.1/16 area 0.0.0.0

 
