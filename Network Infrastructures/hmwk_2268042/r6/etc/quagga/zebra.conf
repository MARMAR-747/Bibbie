# Set the hostname of the Zebra daemon
hostname r6

# Password used to access Zebra configuration mode
password zebra

# Enable password for privileged (enable) mode
enable password zebra

# ==================== Interface Configuration ====================
# Zebra manages interface addresses and installs routes
# into the Linux kernel routing table

interface eth0
 # Point-to-point link between r6 and r5
 ip address 100.0.0.7/31
 link-detect

interface eth1
 # Point-to-point link between r6 and r8
 ip address 100.0.0.10/31
 link-detect

interface eth2
 # Point-to-point link between r6 and r7
 ip address 100.0.0.4/31
 link-detect

interface eth3
 # Interface connecting r6 to an external network
 ip address 23.75.200.1/16
 link-detect
