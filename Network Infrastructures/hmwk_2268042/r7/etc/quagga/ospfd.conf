# Set the hostname of the OSPF daemon
hostname r7

# Password used to access the OSPF daemon
password zebra

# ==================== OSPF Interface Configuration ====================
# Configure a reduced hello interval on all interfaces
# to speed up neighbor discovery and OSPF convergence

interface eth0
 ospf hello-interval 2

interface eth1
 ospf hello-interval 2

interface eth2
 ospf hello-interval 2

interface eth3
 ospf hello-interval 2

# ==================== OSPF Routing Process ====================
router ospf

 # Advertise the point-to-point link between r7 and r8
 network 100.0.0.2/31 area 0.0.0.0

 # Advertise the point-to-point link between r7 and r5
 network 100.0.0.9/31 area 0.0.0.0

 # Advertise the point-to-point link between r7 and r6
 network 100.0.0.5/31 area 0.0.0.0

 # Advertise the external network connected to r7
 network 151.0.45.0/31 area 0.0.0.0

