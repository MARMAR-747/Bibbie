# ==================== OPENVPN SERVER CONFIGURATION ====================

# TCP port on which the OpenVPN server listens
port 7070

# Use TCP as transport protocol
proto tcp

# Use a TUN device (layer 3 VPN)
dev tun

# ==================== CRYPTOGRAPHIC MATERIAL ====================

# Certificate Authority certificate
ca /root/ca.crt

# Server certificate (Common Name: vpn_server)
cert /root/vpn_server.crt

# Server private key
key /root/vpn_server.key

# Diffie-Hellman parameters for key exchange
dh /root/dh2048.pem

# ==================== VPN NETWORK CONFIGURATION ====================

# Use subnet topology (each client gets an IP in the VPN subnet)
topology subnet

# Define the VPN subnet
server 10.10.0.0 255.255.255.0

# Allow VPN clients to directly communicate with each other
client-to-client

# Directory containing client-specific configuration files
client-config-dir /root/ccd

# Push a route to the clients so they can reach the LAN behind s3
push "route 192.168.88.0 255.255.255.0"

# ==================== CONNECTION MANAGEMENT ====================

# Send keepalive packets and restart the connection if inactive
keepalive 10 120

# Do not re-read key files across restarts
persist-key

# Keep the TUN device open across restarts
persist-tun

# Set verbosity level for logging
verb 3

